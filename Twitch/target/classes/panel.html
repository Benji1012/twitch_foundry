<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Twitch Extension Panel</title>
  <style>
    body {
      margin: 0;
      background-color: #18181b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #9147ff;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #772ce8;
    }
  </style>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>

</head>
	<body>
	  <h1>Játékosok</h1>
	  <div id="playersContainer">Betöltés...</div>

	  <script>
	   const auth = { token: "dummy_token_for_testing" };
			fetch("http://localhost:8080/players", {
	        headers: {
	          'Authorization': 'Bearer ' + auth.token // optional if you validate Twitch tokens
	        }
	      })
	      .then(res => res.json())
	      .then(players => {
	        const container = document.getElementById("playersContainer");
	        container.innerHTML = ""; // clear loading message

	        if (players.length === 0) {
	          container.innerText = "Nincs játékos.";
	        } else {
	          players.forEach(player => {
	            const card = document.createElement("div");
	            card.style.marginBottom = "20px";
	            card.innerHTML = `
				<h2>${player.name}</h2>
				  <p>AC: ${player.ac}</p>
				  <p>HP: ${player.currentHp} / ${player.maxHp}</p>
				  <p>STR: ${player.str}, DEX: ${player.dex}, CON: ${player.con}</p>
				  <p>INT: ${player.intel}, WIS: ${player.wis}, CHA: ${player.cha}</p>
	            `;
	            container.appendChild(card);
	          });
	        }
	      })
	      .catch(err => {
	        document.getElementById("playersContainer").innerText = "Hiba a játékosok lekérésekor.";
	        console.error("Hiba:", err);
	      });
	   
	  </script>
</body>
</html>
